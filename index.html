<!doctype html>

<head>

<body>
<div class="dim-overlay" aria-hidden="true"></div>
<section class="thumb" data-stage-w="1920" data-stage-h="1080" data-fit="contain" data-section-name="Hero">
  <div class="thumb-stage">
   <div class="hero-cluster">
    <div class="hl-yellow" aria-hidden="true"></div>
    <div class="framing" aria-hidden="true"><i class="fr-l"></i><i class="fr-t"></i><i class="fr-r"></i><i class="fr-b"></i><i class="fr-h fr-h--tl"></i><i class="fr-h fr-h--tr"></i><i class="fr-h fr-h--bl"></i><i class="fr-h fr-h--br"></i></div>
    <h1 class="headline">
      <span class="hl-hi">Hi! I’m an</span>
      <span class="hl-ai">AI  Product  Design</span>
      <span class="hl-eng">&lt;/Engineer&gt;</span>
    </h1>
    <div class="select" aria-hidden="true">
      <div class="select-bg"></div>
      <div class="handle handle--l"><img src="assets/thumb/handle.svg" alt=""><i></i></div>
      <div class="handle handle--r"><img src="assets/thumb/handle.svg" alt=""><i></i></div>

    <img class="intro-cursor" src="assets/thumb/cursor-black-move-h.svg" alt="" aria-hidden="true">
    <div class="badge-vibe"><span>[VIbecode]</span></div>
   </div>

  </div>
  <div class="toast" role="status" aria-live="polite"></div>
  <div class="pill-left">
    <button class="pl-menu" type="button" aria-haspopup="menu" aria-label="Figma menu"><span class="pl-logo"><img src="assets/thumb/figma.svg" alt=""></span><img class="pl-chev" src="assets/thumb/chevron.svg" alt=""></button>
    <span class="pl-file">Home</span>
    <span class="pl-div"></span>
    <span class="pl-page"><img src="assets/thumb/pages.svg" alt=""><span class="pl-track" id="pl-track" aria-live="polite"><span class="pl-item">Hero</span></span></span>
  </div>

  <div class="sidebar-right">
    <div class="sr-avatar"><img src="assets/thumb/avatar.svg" alt=""><img class="sr-chev" src="assets/thumb/chevron.svg" alt=""></div>
    <button class="sr-share" type="button">Not allow to <s>Share</s></button>
  </div>

  <div class="zoom-help">
    <div class="zoom"><div class="zoom-minus"><i></i></div><img class="zoom-plus" src="assets/thumb/zoom-plus.svg" alt=""></div>
    <div class="help"><img src="assets/thumb/help-bubble.svg" alt=""></div>
  </div>

  <div class="toolbar">
    <div class="tb-move"><img src="assets/thumb/move.svg" alt=""><img src="assets/thumb/hand.svg" alt=""></div>
    <span class="tb-div"></span>
    <div class="tb-objects">
      <div class="tb-marker"><img src="assets/thumb/marker.svg" alt=""></div>
      <div class="tb-sticky">
        <div class="stack">
          <i class="sq sq3"></i>
          <i class="sq sq2"></i>
          <div class="curly">
            <div class="curly-clip">
              <i class="curly-fill"></i>
              <i class="curly-shadow"></i>
              <img class="curl curl--c" src="assets/thumb/curl-color.svg" alt="">
              <img class="curl curl--g" src="assets/thumb/curl-glare.svg" alt="">
            </div>
          </div>
        </div>
      </div>
      <img class="tb-shapes" src="assets/thumb/shapes.svg" alt="">
    </div>
    <span class="tb-div"></span>
    <div class="tb-flat">
      <span class="fi fi--1"><img src="assets/thumb/icon-1.svg" alt=""></span>
      <span class="fi fi--2"><img src="assets/thumb/icon-2.svg" alt=""></span>
      <span class="fi fi--3"><img src="assets/thumb/icon-3.svg" alt=""></span>
      <span class="fi fi--4"><img src="assets/thumb/icon-4.svg" alt=""></span>
    </div>
    <span class="tb-div"></span>
    <div class="tb-insert">
      <span class="ins ins--align"><img src="assets/thumb/alignment.svg" alt=""></span>
      <span class="ins ins--alert"><img src="assets/thumb/alert.svg" alt=""></span>
      <span class="ins ins--laugh"><span><img src="assets/thumb/laugh.svg" alt=""></span></span>
      <span class="ins ins--booth"><span><img src="assets/thumb/photobooth.png" alt=""></span></span>
      <span class="ins-plus"><i></i><img src="assets/thumb/plus32.svg" alt=""></span>
    </div>
  </div>
</section>

      <div class="stage" id="stage">
        <div class="layer layer--badge">
          <div class="badge-wrap">

              <div class="badge-shine"></div>
              <div class="badge-glyph"><img src="assets/icons/badge-glyph.svg" alt=""></div>
              <div class="badge-asterisk"><img src="assets/icons/badge-asterisk.svg" alt=""></div>
            </div>
          </div>
        </div>

        <div class="layer layer--tagline">
          <div class="pill"><span>#Human Taste, AI Speed</span></div>
        </div>

        <div class="layer layer--card">
          <div class="card">
            <h2>Feel free to connect!</h2>
            <div class="card-row">
              <div class="col col--left">
                <a class="item" href="tel:+84333442129"><img src="assets/icons/phone.svg" alt=""><span>(+84) 333.44.2129</span></a>
                <a class="item" href="mailto:vietanh.ngx29@gmail.com"><img src="assets/icons/email.svg" alt=""><span>vietanh.ngx29@gmail.com</span></a>
              </div>
              <div class="col col--right">
                <a class="item item--social" href="https://www.linkedin.com/in/vitan2911/" target="_blank" rel="noopener"><img src="assets/icons/linkedin.svg" alt=""><span>/vitan2911</span></a>
                <a class="item item--social item--two" href="https://www.behance.net/vitan2911" target="_blank" rel="noopener"><img src="assets/icons/behance.svg" alt=""><img src="assets/icons/dribbble.svg" alt=""><span>/vitan2911</span></a>
              </div>
            </div>
          </div>
        </div>

        <div class="avatar-group" id="avatar-group">
          <div class="avatar-photo" id="avatar-photo"><img src="assets/img/avatar-circle.jpg" alt="" decoding="async"></div>
          <div class="person" id="person">
            <img src="assets/img/avatar-cutout.png" alt="" width="733" height="1100" decoding="async">
          </div>
          <div class="avatar-ring" id="avatar-ring"></div>
        </div>

        <button class="avatar-btn" id="avatar-btn" type="button" aria-label="Show contact info" aria-expanded="false"></button>
      </div>
    </div>
  </section>

  <section class="outro" data-section-name="Outro">
    <p>Hover vào avatar để xem spotlight.</p>
